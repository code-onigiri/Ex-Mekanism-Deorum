# --- Gradle -----------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.console=rich

# --- Mod metadata (expanded into META-INF/neoforge.mods.toml) ---------------
mod_id=exmekdeorum
mod_name=Ex Mekanism Deorum
mod_group_id=dev.codeonigiri.exmekdeorum
mod_version=0.2.1
mod_license=GPL-3.0-only
mod_authors=codeonigiri
mod_description=An Ex Deorum and Mekanism addon.

# --- Dependency versions and required ranges --------------------------------
# The concrete dev-classpath artifacts (CurseForge file ids) live in build.gradle.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.265,)
loader_version_range=[4,)
exdeorum_version_range=[3.12,)
# Mekanism reports 10.7.19 as its mod version (the jar file name carries build 85).
mekanism_version_range=[10.7.19,)
