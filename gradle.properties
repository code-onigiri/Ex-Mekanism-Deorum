# --- Gradle -----------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.console=rich

# --- Mod metadata (expanded into META-INF/mods.toml) ------------------------
mod_id=exmekdeorum
mod_name=Ex Mekanism Deorum
mod_group_id=dev.codeonigiri.exmekdeorum
mod_version=0.2.3
mod_license=GPL-3.0-only
mod_authors=codeonigiri
mod_description=An Ex Deorum and Mekanism addon.

# --- Dependency versions and required ranges --------------------------------
# The concrete dev-classpath artifacts (CurseForge file ids) live in build.gradle.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=1.20.1-47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
# Ex Deorum 1.20.1 line (jar version 1.53).
exdeorum_version_range=[1.53,)
# Mekanism 1.20.1 line (10.4.16).
mekanism_version_range=[10.4.16,)
