modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"

[[dependencies.${mod_id}]]
modId = "forge"
type = "required"
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "exdeorum"
type = "required"
versionRange = "${exdeorum_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism"
type = "required"
versionRange = "${mekanism_version_range}"
ordering = "AFTER"
side = "BOTH"

# Optional client-side integration: JEI displays Ex Deorum's recipes and lists
# this mod's machines as crafting catalysts for them. The plugin class is only
# loaded when JEI is present.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[15.74.0,)"
ordering = "AFTER"
side = "CLIENT"

# Optional addon compatibility. These mods are never required; when present the
# matching integration activates (tier installers can upgrade this mod's
# factories, and Empowered's upgrades apply through Mekanism's own upgrade hooks).
[[dependencies.${mod_id}]]
modId = "evolvedmekanism"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism_empowered"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism_extras"
type = "optional"
versionRange = "[1.4,)"
ordering = "AFTER"
side = "BOTH"

# Evolved Mekanism Extras provides the four hybrid tiers (Absolute Overclocked
# and up). It itself requires Evolved Mekanism and Mekanism Extras.
[[dependencies.${mod_id}]]
modId = "emextras"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
