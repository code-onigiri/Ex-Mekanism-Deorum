plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    // All mod dependencies resolve from CurseForge Maven.
    maven {
        name = 'CurseForge'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Everything (required mods, JEI, compatibility targets and add-ons) is resolved from
    // CurseForge Maven, so the Nix dev shell only needs to provide Java and Gradle.
    // Dev runs load all of these; the built jar bundles none of them.
    minecraft "net.minecraftforge:forge:${forge_version}"

    implementation fg.deobf('curse.maven:ex-deorum-901420:8384482')
    implementation fg.deobf('curse.maven:mekanism-268560:6552911')
    implementation fg.deobf('curse.maven:jei-238222:9394360')
    implementation fg.deobf('curse.maven:applied-energistics-2-223794:9357405')
    implementation fg.deobf('curse.maven:applied-mekanistics-574300:7244744')
    implementation fg.deobf('curse.maven:evolved-mekanism-1230085:9352796')
    // Evolved Mekanism requires Iglee's Library (igleelib).
    implementation fg.deobf('curse.maven:iglee-library-541199:6987117')
    implementation fg.deobf('curse.maven:mekanism-extras-1026040:8247562')
    implementation fg.deobf('curse.maven:mekanism-empowered-1256390:8064675')
    implementation fg.deobf('curse.maven:mekanism-empowered-core-1256399:8064676')
    // Mekanism: Empowered is a Kotlin mod and requires Kotlin for Forge.
    implementation fg.deobf('curse.maven:kotlin-for-forge-351264:7291067')
    implementation fg.deobf('curse.maven:evolved-mekanism-extras-1268159:9487943')
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            // `-PquickPlayWorld=<save name>` jumps straight into a singleplayer save (used by
            // tools/ for automated GUI screenshots).
            if (project.hasProperty('quickPlayWorld')) {
                args '--quickPlaySingleplayer', project.property('quickPlayWorld').toString()
            } else if (project.hasProperty('quickPlayMultiplayer')) {
                args '--quickPlayMultiplayer', project.property('quickPlayMultiplayer').toString()
            }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            loader_version_range   : loader_version_range,
            forge_version_range    : forge_version_range,
            minecraft_version_range: minecraft_version_range,
            exdeorum_version_range : exdeorum_version_range,
            mekanism_version_range : mekanism_version_range,
    ]
    inputs.properties(expandProps)
    filesMatching('META-INF/mods.toml') {
        expand(expandProps)
    }
}

// ForgeGradle registers the run tasks (runClient/runServer/runData) in its own
// afterEvaluate, so they do not exist yet while this script is evaluated.
afterEvaluate {
    tasks.named('runData').configure {
        doFirst {
            file('src/generated/resources').mkdirs()
        }
    }

    tasks.named('runServer').configure {
        doFirst {
            def eula = file('run/eula.txt')
            eula.parentFile.mkdirs()
            eula.text = 'eula=true\n'
        }
    }
}

// Forward the console to the game process, so 'stop' works for runServer /
// runClient (also from scripts: (sleep 30; echo stop) | gradle runServer).
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}
