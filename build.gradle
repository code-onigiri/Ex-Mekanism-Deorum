plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // All mod dependencies resolve from CurseForge Maven.
    maven {
        name = 'CurseForge'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Everything (required mods, JEI, compatibility targets and add-ons) is resolved from
    // CurseForge Maven, so the Nix dev shell only needs to provide Java and Gradle.
    // Dev runs load all of these; the built jar bundles none of them.
    implementation 'curse.maven:ex-deorum-901420:8384464'
    implementation 'curse.maven:mekanism-268560:7904058'
    implementation 'curse.maven:jei-238222:8857687'
    implementation 'curse.maven:mek-energistics-1564287:8969316'
    implementation 'curse.maven:applied-energistics-2-223794:8992605'
    implementation 'curse.maven:applied-mekanistics-574300:7096962'
    implementation 'curse.maven:guideme-1173950:9366366'
    implementation 'curse.maven:evolved-mekanism-1230085:9352850'
    // Evolved Mekanism requires Iglee's Library (igleelib).
    implementation 'curse.maven:iglee-library-541199:7000755'
    implementation 'curse.maven:mekanism-extras-1026040:8677677'
    implementation 'curse.maven:mekanism-empowered-1256390:8064666'
    implementation 'curse.maven:mekanism-empowered-core-1256399:8064667'
    // Mekanism: Empowered is a Kotlin mod and requires Kotlin for Forge.
    implementation 'curse.maven:kotlin-for-forge-351264:8335665'
    implementation 'curse.maven:evolved-mekanism-extras-1268159:8678947'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = file('run')
            // `-PquickPlayWorld=<save name>` jumps straight into a singleplayer save (used by
            // tools/ for automated GUI screenshots).
            if (project.hasProperty('quickPlayWorld')) {
                programArgument('--quickPlaySingleplayer')
                programArgument(project.property('quickPlayWorld').toString())
            } else if (project.hasProperty('quickPlayMultiplayer')) {
                programArgument('--quickPlayMultiplayer')
                programArgument(project.property('quickPlayMultiplayer').toString())
            }
        }
        server {
            server()
            gameDirectory = file('run')
            programArgument('--nogui')
        }
        data {
            data()
            gameDirectory = file('run')
            programArgument('--mod')
            programArgument(mod_id)
            programArgument('--all')
            programArgument('--output')
            programArgument(file('src/generated/resources').absolutePath)
            programArgument('--existing')
            programArgument(file('src/main/resources').absolutePath)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            loader_version_range   : loader_version_range,
            neo_version_range      : neo_version_range,
            minecraft_version_range: minecraft_version_range,
            exdeorum_version_range : exdeorum_version_range,
            mekanism_version_range : mekanism_version_range,
    ]
    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(expandProps)
    }
}

tasks.named('runData').configure {
    doFirst {
        file('src/generated/resources').mkdirs()
    }
}

tasks.named('runServer').configure {
    doFirst {
        def eula = file('run/eula.txt')
        eula.parentFile.mkdirs()
        eula.text = 'eula=true\n'
    }
}

// Forward the console to the game process, so 'stop' works for runServer /
// runClient (also from scripts: (sleep 30; echo stop) | gradle runServer).
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}
